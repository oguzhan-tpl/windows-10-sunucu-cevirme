<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astra Server</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap">
<header><div><div class="kicker">ASTRA SERVER</div><h1>Windows 10 kişisel servis ağı</h1></div><span id="who">Misafir</span></header>

<section id="auth">
<div class="cols">
<form id="login" class="card"><h2>Giriş</h2><input id="lu" placeholder="Kullanıcı adı" required><input id="lp" type="password" placeholder="Şifre" required><button>Giriş</button></form>
<form id="register" class="card"><h2>Hesap</h2><input id="ru" placeholder="Kullanıcı adı" required><input id="rp" type="password" placeholder="En az 8 karakter" required><button>Kayıt ol</button></form>
</div>
</section>

<section id="app" class="hidden">
<div class="stats"><div class="card"><small>Rol</small><strong id="role">-</strong></div><div class="card"><small>Medya</small><strong id="mc">0</strong></div><div class="card"><small>Durum</small><strong>ONLINE</strong></div></div>
<div class="cols">
<section class="card"><div class="head"><h2>Medya</h2><button id="refresh" class="ghost">Yenile</button></div><div id="media" class="list"></div></section>
<section id="dev" class="card hidden"><div class="head"><h2>Developer</h2><span class="muted">localhost proje alanları</span></div><form id="project" class="row"><input id="pn" placeholder="Proje adı" required><button>Oluştur</button></form><div id="projects" class="list"></div></section>
</div>
<section id="admin" class="card hidden"><div class="head"><h2>Admin medya</h2></div><form id="upload" class="row"><input id="mt" placeholder="Başlık" required><input id="mf" type="file" required><button>Yükle</button></form><div id="admin-media" class="list"></div></section>
<button id="out" class="danger">Çıkış</button>
</section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
